
name: Build Sodium Addon

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Extract source
        run: unzip -q Sodium-Addon-Source.zip -d source

      - name: Build mod
        run: |
          PROJECT_DIR=$(dirname "$(find source -name build.gradle -print -quit)")
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Sodium-Addon
          path: source/**/build/libs/*.jar
