
name: Build Sodium Addon

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Extract source
        run: unzip -q Sodium-Addon-Source.zip -d source

           - name: Extract source
        run: |
          ZIP_FILE=$(find . -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi
          echo "Found: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Sodium-Addon
          path: source/**/build/libs/*.jar
